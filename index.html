<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Edgar Andres Angrino Lafaux | Portfolio language selector</title>
		<meta
			name="description"
			content="Choose English or Spanish to view Edgar Andres Angrino Lafaux's software engineering portfolio. Selecciona inglés o español para ver el portafolio." />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#0f1115" />
		<link rel="canonical" href="https://eaangrino.github.io/" />
		<link
			rel="alternate"
			hreflang="es"
			href="https://eaangrino.github.io/es/" />
		<link
			rel="alternate"
			hreflang="en"
			href="https://eaangrino.github.io/en/" />
		<link
			rel="alternate"
			hreflang="x-default"
			href="https://eaangrino.github.io/" />
		<link rel="icon" type="image/svg+xml" href="/skull.svg" />

		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				background: #0f1115;
				color: #f4f4f5;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-width: 320px;
				background:
					radial-gradient(
						circle at 14% 10%,
						rgba(255, 255, 255, 0.06),
						transparent 30rem
					),
					radial-gradient(
						circle at 88% 86%,
						rgba(255, 255, 255, 0.04),
						transparent 28rem
					),
					linear-gradient(180deg, #111318 0%, #0b0d10 100%);
			}

			.language-shell {
				display: grid;
				min-height: 100vh;
				min-height: 100svh;
				place-items: center;
				padding: 1.5rem;
			}

			.language-card {
				width: min(100%, 48rem);
				padding: clamp(1.5rem, 4vw, 3rem);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 1.75rem;
				background: rgba(24, 27, 33, 0.9);
				box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
				backdrop-filter: blur(18px);
				-webkit-backdrop-filter: blur(18px);
			}

			.brand {
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
			}

			.brand-mark {
				display: grid;
				width: 4.5rem;
				height: 4.5rem;
				margin-bottom: 1.5rem;
				place-items: center;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 1.35rem;
				background: rgba(255, 255, 255, 0.04);
			}

			.brand-mark svg {
				width: 2.9rem;
				height: 2.9rem;
			}

			.eyebrow {
				margin: 0 0 0.75rem;
				color: rgba(244, 244, 245, 0.52);
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.22em;
				text-transform: uppercase;
			}

			h1 {
				margin: 0;
				font-size: clamp(2rem, 7vw, 3.5rem);
				font-weight: 650;
				letter-spacing: -0.045em;
				line-height: 1.05;
			}

			.intro {
				max-width: 34rem;
				margin: 1.25rem auto 0;
				color: rgba(244, 244, 245, 0.68);
				font-size: clamp(0.95rem, 2vw, 1.05rem);
				line-height: 1.7;
			}

			.intro span {
				display: block;
			}

			.intro span + span {
				margin-top: 0.35rem;
			}

			.language-options {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 0.9rem;
				margin-top: 2.25rem;
			}

			.language-option {
				display: flex;
				align-items: center;
				gap: 1rem;
				min-height: 6.25rem;
				padding: 1.15rem;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 1.25rem;
				background: rgba(255, 255, 255, 0.035);
				color: #f4f4f5;
				text-decoration: none;
				transition:
					transform 160ms ease,
					border-color 160ms ease,
					background-color 160ms ease;
			}

			.language-option:hover {
				transform: translateY(-2px);
				border-color: rgba(255, 255, 255, 0.22);
				background: rgba(255, 255, 255, 0.07);
			}

			.language-option:focus-visible {
				outline: 2px solid #a1a1aa;
				outline-offset: 4px;
			}

			.flag {
				display: grid;
				width: 3rem;
				height: 3rem;
				flex: 0 0 auto;
				place-items: center;
				border-radius: 0.9rem;
				background: rgba(255, 255, 255, 0.06);
				font-size: 1.55rem;
				line-height: 1;
			}

			.language-copy {
				min-width: 0;
			}

			.language-name {
				display: block;
				font-size: 1.05rem;
				font-weight: 700;
				letter-spacing: -0.01em;
			}

			.language-caption {
				display: block;
				margin-top: 0.2rem;
				color: rgba(244, 244, 245, 0.55);
				font-size: 0.82rem;
			}

			.language-code {
				margin-left: auto;
				padding: 0.3rem 0.5rem;
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 999px;
				color: rgba(244, 244, 245, 0.62);
				font-size: 0.68rem;
				font-weight: 700;
				letter-spacing: 0.08em;
			}

			.footer-note {
				margin: 1.5rem 0 0;
				color: rgba(244, 244, 245, 0.52);
				font-size: 0.75rem;
				text-align: center;
			}

			@media (max-width: 39rem) {
				.language-shell {
					padding: 1rem;
				}

				.language-card {
					padding: 1.4rem;
					border-radius: 1.4rem;
				}

				.language-options {
					grid-template-columns: 1fr;
				}

				.language-option {
					min-height: 5.5rem;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.language-option {
					transition: none;
				}

				.language-option:hover {
					transform: none;
				}
			}
		</style>
	</head>

	<body>
		<main class="language-shell">
			<section class="language-card" aria-labelledby="language-title">
				<div class="brand">
					<div class="brand-mark" aria-hidden="true">
						<svg
							viewBox="0 0 700 700"
							fill="none"
							xmlns="http://www.w3.org/2000/svg">
							<path
								opacity="0.9"
								d="M319.5 497.5V618L244.5 558V452L319.5 497.5ZM454.75 558L379.75 618V497.5L454.75 452V558ZM215.5 468V558L170 513V437.5L215.5 468ZM529.25 513L483.75 558V468L529.25 437.5V513ZM408.699 81L484.66 218.037L409.25 259.5V333.5L467.75 364L524.758 314.355L573.536 379.214L543.75 409H394.75L349.5 484L304.5 409H155.5L125.714 379.214L174.492 314.355L231.5 364L290 333.5V259.5L154.5 185L111.5 215.5V259.5L142.709 286.678L95.5 349L36 289.5L154.938 81H408.699ZM663.25 289.5L603.75 349L556.541 286.678L587.75 259.5V215.5L544.75 185L524.093 196.356L460.149 81H544.312L663.25 289.5Z"
								fill="currentColor" />
						</svg>
					</div>
					<p class="eyebrow">Software Engineering Portfolio</p>
					<h1 id="language-title">Edgar Angrino</h1>
					<p class="intro">
						<span lang="es"
							>Selecciona el idioma para continuar al portafolio.</span
						>
						<span lang="en">Choose your language to continue.</span>
					</p>
				</div>

				<nav
					class="language-options"
					aria-label="Select language / Seleccionar idioma">
					<a class="language-option" href="/es/" hreflang="es" lang="es">
						<span class="flag" aria-hidden="true">🇨🇴</span>
						<span class="language-copy">
							<span class="language-name">Español</span>
							<span class="language-caption">Ver portafolio en español</span>
						</span>
						<span class="language-code" aria-hidden="true">ES</span>
					</a>

					<a class="language-option" href="/en/" hreflang="en" lang="en">
						<span class="flag" aria-hidden="true">🇺🇸</span>
						<span class="language-copy">
							<span class="language-name">English</span>
							<span class="language-caption">View portfolio in English</span>
						</span>
						<span class="language-code" aria-hidden="true">EN</span>
					</a>
				</nav>

				<p class="footer-note">eaangrino.github.io</p>
			</section>
		</main>
	</body>
</html>
