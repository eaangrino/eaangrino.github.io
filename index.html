<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Edgar Angrino</title>
		<meta name="robots" content="noindex, follow" />
		<link rel="alternate" hreflang="es" href="https://eaangrino.github.io/es/" />
		<link rel="alternate" hreflang="en" href="https://eaangrino.github.io/en/" />
		<link rel="alternate" hreflang="x-default" href="https://eaangrino.github.io/es/" />
		<link rel="icon" type="image/svg+xml" href="/skull.svg" />
		<script>
			(function () {
				var storedLanguage = localStorage.getItem('i18nextLng');
				var browserLanguage =
					navigator.language &&
					navigator.language.toLowerCase().startsWith('en')
						? 'en'
						: 'es';
				var language =
					storedLanguage === 'en' || storedLanguage === 'es'
						? storedLanguage
						: browserLanguage;

				window.location.replace('/' + language + '/');
			})();
		</script>
	</head>

	<body>
		<main>
			<p>Select a language / Selecciona un idioma:</p>
			<ul>
				<li><a href="/en/" hreflang="en" lang="en">English</a></li>
				<li><a href="/es/" hreflang="es" lang="es">Español</a></li>
			</ul>
		</main>
	</body>
</html>
